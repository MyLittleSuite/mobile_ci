name: Publish Android Images

on:
  release:
    types: [ published ]
  push:
    branches:
      - develop

jobs:
  publish:
    name: Push Android Image to Docker Hub
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        api: [34, 35]
        arch: [x64, arm64]
        include:
          - api: 34
            build_tools: "34.0.0"
            cmdtools: 10406996
          - api: 35
            build_tools: "35.0.0"
            cmdtools: 13114758
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Get release name
        uses: olegtarasov/get-tag@v2.1.2
        id: tagName
      - name: Build and push Flutter image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GIT_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ steps.tagName.outputs.tag }}
        run: |
          chmod +x build.sh
          ./build.sh --build --deploy --android-api ${{ matrix.api }} --build-tools ${{ matrix.build_tools }} --cmdtools ${{ matrix.cmdtools }} --arch ${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}

  publish-manifest:
    name: Publish Manifest
    runs-on: ubuntu-latest
    needs:
      - publish
    strategy:
      matrix:
        api: [34, 35]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Get release name
        uses: olegtarasov/get-tag@v2.1.2
        id: tagName
      - name: Publish Android image manifest
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GIT_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ steps.tagName.outputs.tag }}
        run: |
          chmod +x manifest.sh
          ./manifest.sh --android-api ${{ matrix.api }}