name: Publish Android Images

on:
  release:
    types: [ published ]
  push:

jobs:
  publish:
    name: Push Android Image to Docker Hub
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        api: [34, 35]
        arch: [x64, arm64]
        include:
          - api: 34
            build_tools: "34.0.0"
            cmdtools: 10406996
          - api: 35
            build_tools: "35.0.0"
            cmdtools: 13114758
          - arch: x64
            java_arch: amd64
          - arch: arm64
            java_arch: arm64
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Get release name
        uses: olegtarasov/get-tag@v2.1.2
        id: tagName
      - name: Build and push Flutter image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GIT_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ steps.tagName.outputs.tag }}
        run: |
          chmod +x build.sh
          ./build.sh --build --android-api ${{ matrix.api }} --build-tools ${{ matrix.build_tools }} --cmdtools ${{ matrix.cmdtools }} --java-arch ${{ matrix.java_arch }}