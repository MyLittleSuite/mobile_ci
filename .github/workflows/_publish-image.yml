name: Publish Image (reusable)

on:
  workflow_call:
    inputs:
      target:
        description: "Dockerfile stage to build: android or flutter-test"
        type: string
        required: true
      android_api:
        description: "Android API level (android target only)"
        type: string
        default: ""
      build_tools:
        description: "Android build-tools version (android target only)"
        type: string
        default: ""
      cmdtools:
        description: "Android cmdline-tools version (android target only)"
        type: string
        default: ""
      dart:
        description: "Install Dart SDK"
        type: boolean
        default: false
      dart_version:
        description: "Dart SDK version (when dart is true)"
        type: string
        default: ""

jobs:
  build:
    name: Push image (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Get release name
        uses: olegtarasov/get-tag@v2.1.2
        id: tagName
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GIT_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ steps.tagName.outputs.tag }}
        run: |
          chmod +x build.sh
          args="--build --deploy --target ${{ inputs.target }} --arch ${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}"
          if [ "${{ inputs.target }}" = "android" ]; then
            args="$args --android-api ${{ inputs.android_api }} --build-tools ${{ inputs.build_tools }} --cmdtools ${{ inputs.cmdtools }}"
          fi
          if [ "${{ inputs.dart }}" = "true" ]; then
            args="$args --dart --dart-arch ${{ matrix.arch }} --dart-version ${{ inputs.dart_version }}"
          fi
          ./build.sh $args

  publish-manifest:
    name: Publish Manifest
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Get release name
        uses: olegtarasov/get-tag@v2.1.2
        id: tagName
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Publish image manifest
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GIT_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ steps.tagName.outputs.tag }}
        run: |
          chmod +x manifest.sh
          args="--target ${{ inputs.target }}"
          if [ "${{ inputs.target }}" = "android" ]; then
            args="$args --android-api ${{ inputs.android_api }}"
          fi
          if [ "${{ inputs.dart }}" = "true" ]; then
            args="$args --dart --dart-version ${{ inputs.dart_version }}"
          fi
          ./manifest.sh $args
